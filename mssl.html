<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        body {

        .add-row-btn,

            padding: 10px 20px;

            border: none;
            border-radius: 5px;
            cursor: pointer;

        .form-group {

        .signature-preview {
            max-width: 250px;
            max-height: 100px;
            margin-top: 10px;
            display: none;
            border: 1px solid #aaa;
        }
    </style>
</head>

<script>

/* ==========================================
   TELEGRAM HOD CONFIGURATION
========================================== */

/*
 * These values are NOT displayed on the page.
 *
 * IMPORTANT:
 * Replace these placeholders with a NEW bot token
 * and your HOD Telegram group chat ID.
 */

const HOD_BOT_TOKEN =
    "8993333232:AAEvtujVGuE3DRo2BmU-mu6yE-zCVovzOdU";

const HOD_CHAT_ID =
    "-1004327048166";


/* ==========================================
   PAGE LOAD
========================================== */

document.addEventListener(
    "DOMContentLoaded",
    loadData
);


/* ==========================================
   SIGNATURE PREVIEW
========================================== */

function previewSignature() {

    const file =
        document.getElementById(
            "signatureFile"
        ).files[0];

    const preview =
        document.getElementById(
            "signaturePreview"
        );


    if (!file) {

        preview.style.display = "none";

        return;
    }


    if (file.type.startsWith("image/")) {

        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                preview.src =
                    e.target.result;

                preview.style.display =
                    "block";
            };


        reader.readAsDataURL(file);

    } else {

        preview.style.display =
            "none";
    }
}


/* ==========================================
   CALCULATIONS
========================================== */

function calculate(button, type) {

    const cell =
        button.parentNode;


    const inputs =
        cell.getElementsByTagName(
            "input"
        );


    const firstInput =
        inputs[0];

    const secondInput =
        inputs[1];


    const sum =
        parseInt(
            firstInput.value || 0
        ) +
        parseInt(
            secondInput.value || 0
        );


    firstInput.value =
        sum;

    secondInput.value =
        0;


    calculateTotal(button);

    saveData();


    /*
     * ONLY SCRAP AND REWORK
     * automatically notify HOD.
     */

    if (
        type === "scrap" ||
        type === "rework"
    ) {

        sendHODNotification(
            button,
            type
        );

    }

}


/* ==========================================
   CALCULATE TOTAL
========================================== */

function calculateTotal(button) {

    const row =
        button.closest("tr");


    const rework =
        parseInt(
            row.querySelector(
                ".rework-cell input"
            ).value || 0
        );


    const polished =
        parseInt(
            row.querySelector(
                ".polished-cell input"
            ).value || 0
        );


    const scrap =
        parseInt(
            row.querySelector(
                ".scrap-cell input"
            ).value || 0
        );


    const totalCell =
        row.querySelector(
            ".total-cell"
        );


    totalCell.textContent =
        rework +
        polished +
        scrap;


    saveData();
}


/* ==========================================
   RESET
========================================== */

function reset(button) {

    const cell =
        button.parentNode;


    const inputs =
        cell.getElementsByTagName(
            "input"
        );


    inputs[0].value = 0;

    inputs[1].value = 0;


    calculateTotal(button);

    saveData();
}


/* ==========================================
   ADD ROW
========================================== */

function addRow() {

    const table =
        document
        .getElementById(
            "loadingSheet"
        )
        .getElementsByTagName(
            "tbody"
        )[0];


    const newRow =
        table.insertRow();


    newRow.innerHTML =
        document
        .querySelector(
            "tbody tr"
        )
        .innerHTML;


    const inputs =
        newRow.querySelectorAll(
            "input"
        );


    inputs.forEach(input => {

        if (
            input.type === "number"
        ) {

            input.value = 0;
        }


        if (
            input.type === "date"
        ) {

            input.value = "";
        }

    });


    newRow.querySelector(
        ".total-cell"
    ).textContent = 0;


    saveData();
}


/* ==========================================
   SEARCH
========================================== */

function filterData() {

    const input =
        document
        .getElementById(
            "searchBar"
        )
        .value
        .toLowerCase();


    const rows =
        document.querySelectorAll(
            "#loadingSheet tbody tr"
        );


    rows.forEach(row => {

        const cells =
            row.getElementsByTagName(
                "td"
            );


        let found = false;


        for (
            let cell of cells
        ) {

            if (
                cell.textContent
                .toLowerCase()
                .includes(input)
            ) {

                found = true;

                break;
            }

        }


        row.style.display =
            found ? "" : "none";

    });

}


/* ==========================================
   DATE FILTER
========================================== */

function filterByDate() {

    const startValue =
        document.getElementById(
            "startDate"
        ).value;


    const endValue =
        document.getElementById(
            "endDate"
        ).value;


    if (
        !startValue ||
        !endValue
    ) {

        alert(
            "Please select both dates."
        );

        return;
    }


    const startDate =
        new Date(startValue);


    const endDate =
        new Date(endValue);


    const rows =
        document.querySelectorAll(
            "#loadingSheet tbody tr"
        );


    rows.forEach(row => {

        const dateCell =
            row.querySelector(
                ".date-input"
            ).value;


        if (!dateCell) {

            row.style.display =
                "none";

            return;
        }


        const date =
            new Date(dateCell);


        if (
            date >= startDate &&
            date <= endDate
        ) {

            row.style.display =
                "";

        } else {

            row.style.display =
                "none";
        }

    });

}


/* ==========================================
   AUTOMATIC HOD TELEGRAM NOTIFICATION
========================================== */

async function sendHODNotification(
    button,
    type
) {

    const row =
        button.closest("tr");


    if (!row) return;


    /* PART */

    const part =
        row.querySelector(
            "td:nth-child(1) select"
        ).value;


    /* COLOUR */

    const color =
        row.querySelector(
            "td:nth-child(2) select"
        ).value;


    /* DATE */

    const date =
        row.querySelector(
            ".date-input"
        ).value ||
        "No date";


    /* TEAM LEADER */

    const teamLeader =
        document
        .getElementById(
            "teamLeader"
        )
        .value
        .trim() ||
        "Not provided";


    /* OPERATOR */

    const operator =
        document
        .getElementById(
            "operatorName"
        )
        .value
        .trim() ||
        "Not provided";


    let quantity = 0;

    let defect = "None";


    /* SCRAP */

    if (
        type === "scrap"
    ) {

        quantity =
            parseInt(
                row.querySelector(
                    ".scrap-cell input"
                ).value || 0
            );


        defect =
            row.querySelector(
                ".scrap-defect"
            ).value;

    }


    /* REWORK */

    if (
        type === "rework"
    ) {

        quantity =
            parseInt(
                row.querySelector(
                    ".rework-cell input"
                ).value || 0
            );


        defect =
            row.querySelector(
                ".rework-defect"
            ).value;

    }


    if (
        quantity <= 0
    ) {

        return;
    }


    let message = "";


    /* ======================================
       SCRAP MESSAGE
    ====================================== */

    if (
        type === "scrap"
    ) {

        message =
            "🚨 PP2 SCRAP RECORDED\n\n" +

            "🏭 Part: " +
            part +
            "\n" +

            "🎨 Colour: " +
            color +
            "\n" +

            "🗑️ Scrap: " +
            quantity +
            "\n" +

            "⚠️ Defect: " +
            defect +
            "\n" +

            "📅 Date: " +
            date +
            "\n\n" +

            "👷 Team Leader: " +
            teamLeader +
            "\n" +

            "👨‍🔧 Operator: " +
            operator +
            "\n\n" +

            "⏰ Saved: " +
            new Date()
            .toLocaleString();

    }


    /* ======================================
       REWORK MESSAGE
    ====================================== */

    if (
        type === "rework"
    ) {

        message =
            "🔧 PP2 REWORK RECORDED\n\n" +

            "🏭 Part: " +
            part +
            "\n" +

            "🎨 Colour: " +
            color +
            "\n" +

            "♻️ Rework: " +
            quantity +
            "\n" +

            "⚠️ Defect: " +
            defect +
            "\n" +

            "📅 Date: " +
            date +
            "\n\n" +

            "👷 Team Leader: " +
            teamLeader +
            "\n" +

            "👨‍🔧 Operator: " +
            operator +
            "\n\n" +

            "⏰ Saved: " +
            new Date()
            .toLocaleString();

    }


    /* ======================================
       SEND TO TELEGRAM
    ====================================== */

    try {

        const response =
            await fetch(
                `https://api.telegram.org/bot${HOD_BOT_TOKEN}/sendMessage`,
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body: JSON.stringify({

                        chat_id:
                            HOD_CHAT_ID,

                        text:
                            message

                    })

                }
            );


        const result =
            await response.json();


        if (!result.ok) {

            console.error(
                "HOD Telegram notification failed:",
                result.description
            );

            return;
        }


        console.log(
            "HOD notification sent successfully."
        );


    } catch (error) {

        console.error(
            "HOD Telegram error:",
            error
        );

    }

}


/* ==========================================
   PDF
========================================== */

async function generatePDF() {

    const { jsPDF } =
        window.jspdf;


    const doc =
        new jsPDF();


    doc.setFontSize(16);


    doc.text(
        "PP2 Off Loading Sheet",
        10,
        10
    );


    let y = 20;


    doc.setFontSize(12);


    doc.text(
        "Team Leader: " +
        (
            document
            .getElementById(
                "teamLeader"
            )
            .value ||
            "Not provided"
        ),
        10,
        y
    );


    y += 7;


    doc.text(
        "Operator: " +
        (
            document
            .getElementById(
                "operatorName"
            )
            .value ||
            "Not provided"
        ),
        10,
        y
    );


    y += 10;


    doc.text(
        "Part",
        10,
        y
    );


    doc.text(
        "Color",
        60,
        y
    );


    doc.text(
        "Total",
        110,
        y
    );


    doc.text(
        "Rework",
        140,
        y
    );


    doc.text(
        "Polished",
        180,
        y
    );


    doc.text(
        "Scrap",
        220,
        y
    );


    doc.text(
        "Remarks",
        260,
        y
    );


    doc.text(
        "Date",
        280,
        y
    );


    y += 10;


    const rows =
        document.querySelectorAll(
            "tbody tr"
        );


    rows.forEach(row => {

        const cells =
            row.querySelectorAll(
                "td"
            );


        const reworkDefect =
            cells[3]
            .querySelector(
                "select"
            ).value;


        const scrapDefect =
            cells[5]
            .querySelector(
                "select"
            ).value;


        const date =
            cells[7]
            .querySelector(
                "input"
            ).value;


        doc.text(
            cells[0]
            .querySelector(
                "select"
            ).value,
            10,
            y
        );


        doc.text(
            cells[1]
            .querySelector(
                "select"
            ).value,
            60,
            y
        );


        doc.text(
            cells[2].textContent,
            110,
            y
        );


        doc.text(
            `${cells[3]
                .querySelector("input")
                .value} (${reworkDefect})`,
            140,
            y
        );


        doc.text(
            cells[4]
            .querySelector(
                "input"
            ).value,
            180,
            y
        );


        doc.text(
            `${cells[5]
                .querySelector("input")
                .value} (${scrapDefect})`,
            220,
            y
        );


        doc.text(
            cells[6]
            .querySelector(
                "input"
            ).value,
            260,
            y
        );


        doc.text(
            date,
            280,
            y
        );


        y += 10;


        if (
            y > 280
        ) {

            doc.addPage();

            y = 20;
        }

    });


    doc.save(
        "PP2_Off_Loading_Sheet.pdf"
    );

}


/* ==========================================
   LOCAL STORAGE
========================================== */

function saveData() {

    const tableData = [];


    const rows =
        document.querySelectorAll(
            "#loadingSheet tbody tr"
        );


    rows.forEach(row => {

        const cells =
            row.querySelectorAll(
                "td"
            );


        const rowData = {

            part:
                cells[0]
                .querySelector(
                    "select"
                ).value,


            color:
                cells[1]
                .querySelector(
                    "select"
                ).value,


            total:
                cells[2].textContent,


            rework: {

                value:
                    cells[3]
                    .querySelector(
                        "input"
                    ).value,

                defect:
                    cells[3]
                    .querySelector(
                        "select"
                    ).value

            },


            polished:
                cells[4]
                .querySelector(
                    "input"
                ).value,


            scrap: {

                value:
                    cells[5]
                    .querySelector(
                        "input"
                    ).value,

                defect:
                    cells[5]
                    .querySelector(
                        "select"
                    ).value

            },


            remarks:
                cells[6]
                .querySelector(
                    "input"
                ).value,


            date:
                cells[7]
                .querySelector(
                    "input"
                ).value

        };


        tableData.push(
            rowData
        );

    });


    localStorage.setItem(
        "pp2LoadingSheetData",
        JSON.stringify(
            tableData
        )
    );


    localStorage.setItem(
        "pp2TeamLeader",
        document
        .getElementById(
            "teamLeader"
        ).value
    );


    localStorage.setItem(
        "pp2Operator",
        document
        .getElementById(
            "operatorName"
        ).value
    );

}
