<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PP2 Parts Loader</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111;
        color: white;
        min-height: 100vh;
        padding: 20px;
    }

    .container {
        max-width: 700px;
        margin: auto;
    }

    h1 {
        text-align: center;
        margin-bottom: 5px;
    }

    .subtitle {
        text-align: center;
        color: #aaa;
        margin-bottom: 25px;
    }

    .card {
        background: #1d1d1d;
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 15px;
        border: 1px solid #333;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    select,
    input {
        width: 100%;
        padding: 13px;
        border-radius: 8px;
        border: 1px solid #555;
        background: #292929;
        color: white;
        font-size: 16px;
        margin-bottom: 15px;
    }

    button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .add {
        background: #444;
        color: white;
        margin-bottom: 12px;
    }

    .send {
        background: #1f8f4d;
        color: white;
    }

    .remove {
        background: #8f2525;
        color: white;
        margin-top: 5px;
    }

    .status {
        text-align: center;
        margin-top: 20px;
        font-weight: bold;
    }

    .row-number {
        color: #aaa;
        margin-bottom: 15px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>PP2 PARTS LOADER</h1>
    <div class="subtitle">Load parts and send them to Telegram</div>

    <div id="partsContainer"></div>

    <button class="add" onclick="addPart()">+ ADD PART</button>

    <button class="send" onclick="sendParts()">
        SEND LOADED PARTS
    </button>

    <div id="status" class="status"></div>

</div>

<script>

/*
====================================================
TELEGRAM SETTINGS
====================================================

DO NOT put your real bot token into a public
GitHub Pages website.

For a public website, use a backend/server to
send the Telegram message.

These are placeholders only.
====================================================
*/

const TELEGRAM_BOT_TOKEN = "8915888233:AAHesonc3FQT27GbIMZYwxSIhcJkGurMqAI";
const TELEGRAM_CHAT_ID = "-1004385640479";


const parts = [
    "H Bar_WLT",
    "H Bar WLT22B",
    "H_Bar LTD",
    "H_Bar LTD22B",
    "WLT",
    "XLT",
    "LTD",
    "MID",
    "High Bumper",
    "BOX Rails J73RH",
    "BOX Rails J73LH",
    "Box Rails P703RH",
    "Box Rails P703LH",
    "Lower P703",
    "Lower J703",
    "Sporthoop J703",
    "Inner P703RH",
    "Inner P703LH",
    "Inner J73RH",
    "Inner J73LH",
    "Wheel lip RearRH",
    "Wheel lip RearLH",
    "Wheel lip FrontRH",
    "Wheel lip FrontLH",
    "Wheel lip RearRH22B",
    "Wheel lip RearLH22B",
    "Wheel lip FrontRH22B",
    "Wheel lip FrontLH22B"
];

const colours = [
    "Boulder Gray",
    "E Black",
    "Moroccan Blue",
    "Frozen White",
    "D. Silver",
    "I. Silver",
    "A Black",
    "Asphalt",
    "Blue Lightning",
    "Carbonised grey",
    "Lucid Red",
    "Cyber Orange"
];


function addPart() {

    const container = document.getElementById("partsContainer");

    const card = document.createElement("div");
    card.className = "card";

    let partOptions = `<option value="">Select Part</option>`;

    parts.forEach(part => {
        partOptions += `<option value="${part}">${part}</option>`;
    });

    let colourOptions = `<option value="">Select Colour</option>`;

    colours.forEach(colour => {
        colourOptions += `<option value="${colour}">${colour}</option>`;
    });

    card.innerHTML = `

        <div class="row-number">
            PART LOAD
        </div>

        <label>Part</label>

        <select class="part">
            ${partOptions}
        </select>

        <label>Colour</label>

        <select class="colour">
            ${colourOptions}
        </select>

        <label>Quantity Loaded</label>

        <input
            type="number"
            class="quantity"
            min="1"
            placeholder="Enter quantity"
        >

        <button class="remove" onclick="this.parentElement.remove()">
            REMOVE
        </button>
    `;

    container.appendChild(card);
}


function getSouthAfricanTime() {

    const now = new Date();

    return now.toLocaleString("en-ZA", {
        timeZone: "Africa/Johannesburg",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });
}


async function sendParts() {

    const cards = document.querySelectorAll(".card");

    if (cards.length === 0) {
        alert("Add at least one part.");
        return;
    }

    const loadedParts = [];

    for (const card of cards) {

        const part = card.querySelector(".part").value;
        const colour = card.querySelector(".colour").value;
        const quantity = card.querySelector(".quantity").value;

        if (!part || !colour || !quantity) {
            alert("Please complete every part load.");
            return;
        }

        loadedParts.push({
            part: part,
            colour: colour,
            quantity: Number(quantity)
        });
    }


    const loadedAt = new Date().toISOString();


    let message = "🚛 PP2 PARTS LOADED\n";
    message += "━━━━━━━━━━━━━━━━━━\n\n";

    loadedParts.forEach((item, index) => {

        message += `${index + 1}. ${item.part}\n`;
        message += `Colour: ${item.colour}\n`;
        message += `Quantity: ${item.quantity}\n`;
        message += `Loaded: ${getSouthAfricanTime()}\n`;
        message += `Timer: 3 HOURS\n\n`;

    });

    message += "━━━━━━━━━━━━━━━━━━\n";
    message += "PP2 LOADER SYSTEM";


    /*
    Store locally as a backup.
    The receiver page can also use this structure
    when both pages are on the same device/browser.
    */

    let existing = JSON.parse(
        localStorage.getItem("pp2LoadedParts") || "[]"
    );

    loadedParts.forEach(item => {

        existing.push({
            id: Date.now() + Math.random(),
            part: item.part,
            colour: item.colour,
            quantity: item.quantity,
            loadedAt: loadedAt
        });

    });

    localStorage.setItem(
        "pp2LoadedParts",
        JSON.stringify(existing)
    );


    /*
    TELEGRAM SEND
    */

    if (
        TELEGRAM_BOT_TOKEN === "YOUR_BOT_TOKEN" ||
        TELEGRAM_CHAT_ID === "YOUR_CHAT_ID"
    ) {

        document.getElementById("status").innerHTML =
            "⚠️ Saved locally. Add your Telegram backend to send the message.";

        console.log(message);

        return;
    }


    try {

        const url =
            `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

        const response = await fetch(url, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message
            })

        });

        const result = await response.json();

        if (!result.ok) {
            throw new Error(result.description);
        }

        document.getElementById("status").innerHTML =
            "✅ PARTS SENT TO TELEGRAM";

        document.getElementById("partsContainer").innerHTML = "";

        addPart();

    } catch (error) {

        console.error(error);

        document.getElementById("status").innerHTML =
            "❌ Telegram sending failed.";
    }
}


addPart();

</script>

</body>
  </html>
