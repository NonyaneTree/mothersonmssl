<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Production Area Selection</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: #000;
    color: #ff0000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.container {
    width: 100%;
    max-width: 500px;
    text-align: center;
}

h1 {
    margin-bottom: 8px;
    font-size: 32px;
    color: #ff0000;
    font-weight: bold;
}

.subtitle {
    color: #ff0000;
    margin-bottom: 35px;
    font-size: 15px;
}

.buttons {
    display: flex;
    flex-direction: column;
    gap: 18px;
}

button {
    width: 100%;
    padding: 25px 20px;

    border: 2px solid #ff0000;
    border-radius: 15px;

    background: #000;
    color: #ff0000;

    font-size: 24px;
    font-weight: bold;

    cursor: pointer;

    transition:
        background 0.2s,
        color 0.2s,
        transform 0.15s;
}

button:hover {
    background: #ff0000;
    color: #000;
}

button:active {
    transform: scale(0.97);
}

.pp1 {
    border-color: #ff0000;
}

.pp2 {
    border-color: #ff0000;
}

.footer {
    margin-top: 30px;
    color: #ff0000;
    font-size: 12px;
}

</style>

</head>

<body>

<div class="container">

    <h1>PP PRODUCTION</h1>

    <div class="subtitle">
        SELECT PRODUCTION AREA
    </div>

    <div class="buttons">

        <button
            class="pp1"
            onclick="window.location.href='layoupp1.html'">
            PP1
        </button>

        <button
            class="pp2"
            onclick="window.location.href='layout.html'">
            PP2
        </button>

    </div>

    <div class="footer">
        PRODUCTION LOADING SYSTEM
    </div>

</div>

</body>
</html>
